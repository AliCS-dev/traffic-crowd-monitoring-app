<!-- legend -->
<g id="node12" class="node">
<title>legend</title>
<text text-anchor="start" x="197.5" y="-119.2" font-family="DejaVu Sans" font-weight="bold" font-size="11.00">Reading the diagram</text>
<text text-anchor="start" x="197.5" y="-96.2" font-family="DejaVu Sans" font-size="11.00">PK = primary key &#160;&#160;FK = foreign key &#160;&#160;FK? = nullable foreign key &#160;&#160;UQ = unique</text>
<text text-anchor="start" x="197.5" y="-74.2" font-family="DejaVu Sans" font-size="11.00">Arrows: parent to child. Labels: parent count : child count. * = many.</text>
<text text-anchor="start" x="197.5" y="-52.2" font-family="DejaVu Sans" font-size="11.00">1 : 0..* means each child has one parent; a parent can have no children or many.</text>
<text text-anchor="start" x="197.5" y="-30.2" font-family="DejaVu Sans" font-size="11.00">Dashed links are optional: a count or alert may have no grid&#45;cell reference.</text>
